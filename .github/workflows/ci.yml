name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Only errors fail the build for now; the codebase has existing
      # warnings and infos that can be cleaned up over time.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
